services:
  backend:
    depends_on: !override []
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_HOST=${HOST_DB_HOST:-192.168.1.86}
      - DB_PORT=${HOST_DB_PORT:-1433}
      - DB_DATABASE=${HOST_DB_DATABASE:-DUNGNTN_HRM}
      - DB_USERNAME=${HOST_DB_USERNAME:-sa}
      - DB_PASSWORD=${HOST_DB_PASSWORD:?Set HOST_DB_PASSWORD in .env or PowerShell before using host SQL Server}
      - CUSTOMER_DB_HOST=${CUSTOMER_DB_HOST:-192.168.1.86}
      - CUSTOMER_DB_PORT=${CUSTOMER_DB_PORT:-1433}
      - CUSTOMER_DB_DATABASE=${CUSTOMER_DB_DATABASE:-DUNGNTN_HRM}
      - CUSTOMER_DB_USERNAME=${CUSTOMER_DB_USERNAME:-sa}
      - CUSTOMER_DB_PASSWORD=${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env or PowerShell before using host SQL Server}

  sqlserver:
    profiles:
      - docker-db-only
